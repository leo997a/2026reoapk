name: REO Pa600 A52s APK
on:
  push:
    branches: [reo-pa600-a52s-test]
    paths:
      - 'pa600-a52s/**'
      - '.github/workflows/reo-pa600-a52s.yml'
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Build installable debug APK
        working-directory: pa600-a52s
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: REO-Pa600-A52s-APK
          path: pa600-a52s/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
